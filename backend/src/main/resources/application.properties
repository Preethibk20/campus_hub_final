# Server
server.port=8080

# Profiles
spring.profiles.active=local

# MongoDB — Unified Storage
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/campushub}
spring.data.mongodb.auto-index-creation=true

# Redis — Local
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=localdevsecrethardcodedfordevonly1234567890abcdef
jwt.expiration=86400000

# Brevo
brevo.api.key=${BREVO_API_KEY}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# CORS
cors.allowed-origin=http://localhost:3000,http://localhost:5173

# Mail
spring.mail.host=localhost
spring.mail.port=1025

# Storage
storage.provider=local
