# Server
server.port=8080

# Profiles
spring.profiles.active=local

# Load environment variables from the root .env file
spring.config.import=optional:file:../.env[.properties]

# MongoDB — Unified Storage
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/campushub}
spring.data.mongodb.auto-index-creation=true

# Redis — Cloud (Upstash/RedisLabs)
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
# Fallback for older config
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=localdevsecrethardcodedfordevonly1234567890abcdef
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# Brevo
brevo.api.key=${BREVO_API_KEY:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# CORS
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Storage
storage.provider=local

logging.level.org.springframework.security=DEBUG
logging.level.com.campushub=DEBUG
brevo.user=${BREVO_USER:noreply@campushub.in}
