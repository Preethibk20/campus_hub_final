# Database with Neon pooling options
spring.datasource.url=${DATABASE_URL}?sslmode=require&options=endpoint%3D{endpoint-id}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.show-sql=false

# Redis via Upstash REST URL
spring.data.redis.url=${UPSTASH_REDIS_REST_URL}

# Storage
storage.provider=cloudinary

# Email
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USER}
spring.mail.password=${BREVO_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Logging
logging.level.root=WARN
logging.level.com.campushub=INFO

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,text/html

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Sentry Error Tracking
sentry.dsn=https://bfbb16f1dde494152e14a111ce6b672b@o4511145030582272.ingest.us.sentry.io/4511146228383744
sentry.environment=production
sentry.release=${SENTRY_RELEASE:unknown}
sentry.server-name=campushub-api
sentry.debug=false
sentry.logging.enabled=true
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info
