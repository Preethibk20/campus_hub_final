# ── DataSource: H2 in-memory (PostgreSQL mode) ────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ───────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── Flyway: disabled — DDL handled by Hibernate in tests ──────────────────
spring.flyway.enabled=false

# ── Redis: use embedded/mock — disable auto-config ────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6370

# ── Storage ───────────────────────────────────────────────────────────────
storage.provider=mock

# ── Mail ──────────────────────────────────────────────────────────────────
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false

# ── JWT ───────────────────────────────────────────────────────────────────
jwt.secret=dGVzdC1zZWNyZXQtbWluaW11bS0zMi1jaGFycy1mb3ItdGVzdGluZy1vbmx5
